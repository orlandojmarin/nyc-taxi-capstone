name: Auto-merge orlando to main

on:
  push:
    branches:
      - orlando

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge orlando into main
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout main
          git merge origin/orlando --no-edit
          git push origin main
